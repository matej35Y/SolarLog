<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Analysis - Energy Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', path='/css/styles.css') }}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/ui">Energy Analysis</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/ui">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/ui/daily">Daily Analysis</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ui/monthly">Monthly Analysis</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 class="mb-4">Daily Energy Analysis</h1>
        
        <div class="row mb-4">
            <div class="col-12">
                <div class="analysis-filters">
                    <div class="period-control">
                        <label for="dateSelector" class="form-label">Select Date</label>
                        <div class="input-group period-navigation">
                            <button class="btn btn-outline-primary period-nav-btn" id="prevDateBtn" type="button" aria-label="Previous day">
                                <span aria-hidden="true">&larr;</span> Prev
                            </button>
                            <input type="date" id="dateSelector" class="form-control">
                            <button class="btn btn-outline-primary period-nav-btn" id="nextDateBtn" type="button" aria-label="Next day">
                                Next <span aria-hidden="true">&rarr;</span>
                            </button>
                        </div>
                    </div>
                    <div class="source-control">
                        <label for="sourceSelector" class="form-label">Price Source</label>
                        <select id="sourceSelector" class="form-select">
                            <option value="">All Sources</option>
                            <option value="hupx" selected>HUPX</option>
                            <option value="memo">MEMO</option>
                        </select>
                    </div>
                    <button class="btn btn-primary load-data-btn" id="loadBtn" type="button">Load Data</button>
                </div>
            </div>
        </div>
        
        <div id="loading" class="text-center d-none">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p>Loading data...</p>
        </div>
        
        <div id="errorMessage" class="alert alert-danger d-none"></div>
        
        <div id="results" class="d-none">
            <div class="row">
                <div class="col-md-12">
                    <div class="summary-box">
                        <h3>Daily Summary</h3>
                        <div class="row">
                            <div class="col-md-3">
                                <p><strong>Date:</strong> <span id="summaryDate"></span></p>
                            </div>
                            <div class="col-md-3">
                                <p><strong>Total Energy:</strong> <span id="summaryEnergy"></span> kWh</p>
                            </div>
                            <div class="col-md-3">
                                <p><strong>Total Value:</strong> <span class="value-highlight" id="summaryValue"></span> EUR</p>
                            </div>
                            <div class="col-md-3">
                                <p><strong>Avg. Price:</strong> <span id="summaryPrice"></span> EUR/MWh</p>
                                <div id="noProductionWarning" class="alert alert-warning mt-2 d-none">
                                    No energy production on this date
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-12">
                    <div class="chart-container">
                        <canvas id="hourlyChart"></canvas>
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-12">
                    <h3>Hourly Data</h3>
                    <div class="table-responsive data-table">
                        <table class="table table-striped table-hover">
                            <thead class="table-dark">
                                <tr>
                                    <th>Hour</th>
                                    <th>Energy (kWh)</th>
                                    <th>Price (EUR/MWh)</th>
                                    <th>Value (EUR)</th>
                                </tr>
                            </thead>
                            <tbody id="dataTable">
                                <!-- Data will be inserted here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', path='/js/daily.js') }}"></script>
</body>
</html>
